name: Generate synchronized lockfiles

on:
  pull_request:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Regenerate Bun lockfile
        run: bun install --lockfile-only

      - name: Verify npm lockfile
        run: |
          rm -rf node_modules
          npm ci

      - name: Verify Bun lockfile
        run: |
          rm -rf node_modules
          bun install --frozen-lockfile

      - name: Upload lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-lockfiles
          path: |
            package-lock.json
            bun.lock
