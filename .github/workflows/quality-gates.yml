name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify governing files
        run: npm run verify:governing-files

      - name: Verify build cycle
        continue-on-error: true
        run: npm run verify:build-cycle

      - name: Verify build cycle 02
        continue-on-error: true
        run: npm run verify:build-cycle-02

      - name: Verify build cycle 03
        continue-on-error: true
        run: npm run verify:build-cycle-03

      - name: Verify build cycle 04
