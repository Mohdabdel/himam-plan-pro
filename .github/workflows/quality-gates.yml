name: Quality Gates

on:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Regenerate Bun lockfile
        run: bun install --lockfile-only

      - name: Verify npm ci
        run: |
          rm -rf node_modules
          npm ci

      - name: Verify frozen Bun install
        run: |
          rm -rf node_modules
          bun install --frozen-lockfile

      - name: Upload synchronized lockfiles
        uses: actions/upload-artifact@v4
        with:
          name: synchronized-lockfiles
          path: |
            package-lock.json
            bun.lock
