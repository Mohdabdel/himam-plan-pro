name: Quality Gates

on:
  pull_request:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target lockfile branch
        uses: actions/checkout@v4
        with:
          ref: chore/sync-lockfiles-2026-11-14
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Regenerate npm lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Regenerate Bun lockfile
        run: bun install --lockfile-only

      - name: Verify npm ci
        run: |
          rm -rf node_modules
          npm ci

      - name: Verify frozen Bun install
        run: |
          rm -rf node_modules
          bun install --frozen-lockfile

      - name: Commit only synchronized lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json bun.lock
          git diff --cached --quiet && exit 0
          git commit -m "Sync npm and Bun lockfiles"
          git push origin HEAD:chore/sync-lockfiles-2026-11-14
