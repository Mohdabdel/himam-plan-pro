name: Quality Gates

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify governing files
        run: npm run verify:governing-files

      - name: Verify build cycle
        run: npm run verify:build-cycle

      - name: Verify build cycle 02
        run: npm run verify:build-cycle-02

      - name: Verify build cycle 03
        run: npm run verify:build-cycle-03

      - name: Verify build cycle 04
        run: npm run verify:build-cycle-04

      - name: Verify build cycle 05
        run: npm run verify:build-cycle-05

      - name: Verify build cycle 06
        run: npm run verify:build-cycle-06

      - name: Verify build cycle 07
        run: npm run verify:build-cycle-07

      - name: Verify build cycle 08
        run: npm run verify:build-cycle-08

      - name: Verify build cycle 09
        run: npm run verify:build-cycle-09

      - name: Verify build cycle 10
        run: npm run verify:build-cycle-10

      - name: Verify build cycle 11
        run: npm run verify:build-cycle-11

      - name: Verify build cycle 12
        run: npm run verify:build-cycle-12

      - name: Verify build cycle 13
        run: npm run verify:build-cycle-13

      - name: Verify build cycle 14
        run: npm run verify:build-cycle-14

      - name: Verify build cycle 15
        run: npm run verify:build-cycle-15

      - name: Verify build cycle 16
        run: npm run verify:build-cycle-16

      - name: Verify build cycle 17
        run: npm run verify:build-cycle-17

      - name: Verify build cycle 18
        run: npm run verify:build-cycle-18

      - name: Verify build cycle 19
        run: npm run verify:build-cycle-19

      - name: Verify build cycle 20
        run: npm run verify:build-cycle-20

      - name: Verify build cycle 21
        run: npm run verify:build-cycle-21

      - name: Verify build cycle 22
        run: npm run verify:build-cycle-22

      - name: Verify build cycle 23
        run: npm run verify:build-cycle-23

      - name: Verify build cycle 24
        run: npm run verify:build-cycle-24

      - name: Verify build cycle 25
        run: npm run verify:build-cycle-25

      - name: Verify build cycle 26
        run: npm run verify:build-cycle-26

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
